<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ইসলামিক প্রশ্নোত্তর</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalpurush&display=swap');
    body { font-family: 'Kalpurush', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-emerald-800 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="#" onclick="showSection('home')" class="text-xl font-bold flex items-center space-x-2">
        <i class="fa-solid font-bold fa-book-quran"></i>
        <span>ইসলামিক প্রশ্নোত্তর</span>
      </a>
      <div class="space-x-4 text-sm font-medium hidden md:block">
        <button onclick="showSection('home')" class="hover:text-emerald-200">হোম</button>
        <button onclick="openModal('about')" class="hover:text-emerald-200">আমাদের সম্পর্কে</button>
        <button onclick="openModal('privacy')" class="hover:text-emerald-200">প্রাইভেসি পলিসি</button>
        <button onclick="openModal('contact')" class="hover:text-emerald-200">যোগাযোগ</button>
      </div>
      <!-- Mobile Menu Button -->
      <div class="md:hidden">
        <button onclick="toggleMobileMenu()" class="text-white focus:outline-none">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
      </div>
    </div>
    <!-- Mobile Navigation links -->
    <div id="mobileMenu" class="hidden md:hidden bg-emerald-900 px-4 py-2 space-y-2 text-sm">
      <button onclick="showSection('home'); toggleMobileMenu();" class="block w-full text-left py-1 hover:text-emerald-200">হোম</button>
      <button onclick="openModal('about'); toggleMobileMenu();" class="block w-full text-left py-1 hover:text-emerald-200">আমাদের সম্পর্কে</button>
      <button onclick="openModal('privacy'); toggleMobileMenu();" class="block w-full text-left py-1 hover:text-emerald-200">প্রাইভেসি পলিসি</button>
      <button onclick="openModal('contact'); toggleMobileMenu();" class="block w-full text-left py-1 hover:text-emerald-200">যোগাযোগ</button>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto w-full p-4 flex-grow">

    <!-- Top Banner Ad Placeholder -->
    <div class="bg-gray-200 border-2 border-dashed border-gray-400 rounded-lg p-4 text-center text-gray-500 my-4">
      <i class="fa-solid fa-rectangle-ad text-xl mr-1"></i> বিজ্ঞাপন স্থান (Top Banner Ad)
    </div>

    <!-- Question Submission Form -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-lg font-semibold text-emerald-800 mb-3 flex items-center">
        <i class="fa-solid fa-pen-to-square mr-2"></i> আপনার প্রশ্ন জমা দিন
      </h2>
      <form id="qaForm" onsubmit="submitQuestion(event)">
        <textarea id="userQuestion" rows="3" required placeholder="আপনার প্রশ্নটি বিস্তারিত লিখুন... (যেমন: সালাত আদায়ের সঠিক নিয়ম কী?)" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none text-gray-700"></textarea>
        <button type="submit" id="submitBtn" class="mt-3 bg-emerald-700 text-white px-5 py-2 rounded-lg hover:bg-emerald-800 transition duration-200 flex items-center justify-center">
          <i class="fa-solid fa-paper-plane mr-2"></i> সাবমিট করুন
        </button>
      </form>
    </div>

    <!-- Search Box -->
    <div class="mb-6">
      <div class="relative">
        <input type="text" id="searchInput" oninput="filterQuestions()" placeholder="প্রশ্ন বা কিওয়ার্ড দিয়ে খুঁজুন..." class="w-full p-3 pl-10 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
      </div>
    </div>

    <!-- QA List Section -->
    <div id="qaList" class="space-y-4">
      <!-- Loading State -->
      <div id="loading" class="text-center py-8 text-gray-500">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-700"></i>
        <p class="mt-2">প্রশ্নোত্তর লোড হচ্ছে...</p>
      </div>
    </div>

  </main>

  <!-- Modals (About, Privacy, Contact) -->
  <div id="infoModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-lg w-full p-6 relative shadow-xl max-h-[80vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-emerald-900 text-white text-center py-4 mt-8 text-sm">
    <p>© 2026 ইসলামিক প্রশ্নোত্তর। সর্বস্বত্ব সংরক্ষিত।</p>
  </footer>

  <!-- Script logic -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwqV5o95GzZp-w9iA5iAalw0-9G0a9-vJq1f-Xg/exec"; // আপনার অ্যাপস স্ক্রিপ্ট ইউআরএল
    let allQuestions = [];

    // Load questions on startup
    window.onload = function() {
      fetchQuestions();
    };

    function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    }

    async function fetchQuestions() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        allQuestions = data;
        renderQuestions(data);
      } catch (err) {
        document.getElementById('qaList').innerHTML = `<p class="text-center text-red-500 py-4">ডেটা লোড করতে সমস্যা হয়েছে।</p>`;
      }
    }

    function renderQuestions(data) {
      const listContainer = document.getElementById('qaList');
      if (!data || data.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-gray-500 py-4">কোনো প্রশ্ন পাওয়া যায়নি।</p>`;
        return;
      }

      listContainer.innerHTML = data.map((item, index) => {
        const isAnswered = item.answer && item.answer.trim() !== "";
        return `
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">প্রশ্ন #${index + 1}</span>
              ${isAnswered 
                ? `<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-medium"><i class="fa-solid fa-circle-check mr-1"></i> উত্তর দেওয়া হয়েছে</span>`
                : `<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-0.5 rounded-full font-medium"><i class="fa-solid fa-clock mr-1"></i> পেন্ডিং</span>`
              }
            </div>
            <h3 class="text-md font-bold text-gray-900 mb-2">প্রশ্ন: ${escapeHtml(item.question)}</h3>
            ${isAnswered ? `
              <div class="mt-3 p-3 bg-emerald-50 border-l-4 border-emerald-600 rounded-r">
                <p class="text-sm text-gray-700 whitespace-pre-line"><strong>উত্তর:</strong> ${escapeHtml(item.answer)}</p>
              </div>
            ` : ''}
          </div>
        `;
      }).reverse().join('');
    }

    async function submitQuestion(e) {
      e.preventDefault();
      const questionInput = document.getElementById('userQuestion');
      const submitBtn = document.getElementById('submitBtn');
      const questionText = questionInput.value.trim();

      if (!questionText) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> জমাদান হচ্ছে...`;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: questionText })
        });

        questionInput.value = '';
        alert('আপনার প্রশ্নটি সফলভাবে জমা হয়েছে! ইনশাআল্লাহ দ্রুত উত্তর দেওয়া হবে।');
        fetchQuestions();
      } catch (err) {
        alert('প্রশ্ন জমা দিতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i> সাবমিট করুন`;
      }
    }

    function filterQuestions() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allQuestions.filter(item => 
        item.question.toLowerCase().includes(query) || 
        (item.answer && item.answer.toLowerCase().includes(query))
      );
      renderQuestions(filtered);
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Modal Content Handlers
    function openModal(type) {
      const modal = document.getElementById('infoModal');
      const content = document.getElementById('modalContent');

      if (type === 'about') {
        content.innerHTML = `
          <h2 class="text-xl font-bold text-emerald-800 mb-3"><i class="fa-solid fa-circle-info mr-2"></i>আমাদের সম্পর্কে</h2>
          <p class="text-gray-700 text-sm leading-relaxed mb-2">
            'ইসলামিক প্রশ্নোত্তর' একটি নির্ভরযোগ্য প্ল্যাটফর্ম, যেখানে ব্যবহারকারীরা তাদের দৈনন্দিন ইসলামিক জীবনের বিভিন্ন প্রশ্ন সরাসরি জমা দিতে পারেন।
          </p>
          <p class="text-gray-700 text-sm leading-relaxed">
            আমাদের লক্ষ্য হলো সহিহ কুরআন ও হাদিসের আলোকে মানুষের প্রশ্নগুলোর সঠিক সমাধান ও দিকনির্দেশনা প্রদান করা।
          </p>
        `;
      } else if (type === 'privacy') {
        content.innerHTML = `
          <h2 class="text-xl font-bold text-emerald-800 mb-3"><i class="fa-solid fa-shield-halved mr-2"></i>প্রাইভেসি পলিসি</h2>
          <p class="text-gray-700 text-sm leading-relaxed mb-2">
            আপনার প্রাইভেসি আমাদের কাছে অত্যন্ত গুরুত্বপূর্ণ। আমরা ব্যবহারকারীদের কোনো ব্যক্তিগত পরিচয় বা তথ্য সংগ্রহ করি না।
          </p>
          <p class="text-gray-700 text-sm leading-relaxed">
            আপনি সাইটে যে প্রশ্ন জমা দেন, তা শুধু উত্তর প্রদানের উদ্দেশ্যে সাময়িকভাবে আমাদের ডেটাবেজে সংরক্ষিত থাকে।
          </p>
        `;
      } else if (type === 'contact') {
        content.innerHTML = `
          <h2 class="text-xl font-bold text-emerald-800 mb-3"><i class="fa-solid fa-envelope mr-2"></i>যোগাযোগ</h2>
          <p class="text-gray-700 text-sm leading-relaxed mb-2">
            যেকোনো পরামর্শ, সংশোধন বা অনুসন্ধানের জন্য আমাদের সাথে যোগাযোগ করুন:
          </p>
          <p class="text-gray-800 font-semibold text-sm mb-1">ইমেইল: rukshanayousuf99@gmail.com</p>
          <p class="text-gray-700 text-sm leading-relaxed">
            আমরা দ্রুততম সময়ের মধ্যে আপনার বার্তার উত্তর দেওয়ার চেষ্টা করব, ইনশাআল্লাহ।
          </p>
        `;
      }
      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('infoModal').classList.add('hidden');
    }
  </script>
</body>
</html>
