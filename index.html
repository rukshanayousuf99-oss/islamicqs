<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ইসলামিক প্রশ্নোত্তর — সঠিক দ্বীনি তথ্যের বিশ্বস্ত মাধ্যম</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --primary: #0d5c3a;
      --primary-dark: #083e27;
      --primary-light: #15803d;
      --accent: #d97706;
      --bg-color: #f4f6f8;
    }
    body {
      font-family: 'Noto Sans Bengali', sans-serif;
      background-color: var(--bg-color);
    }
    .font-arabic {
      font-family: 'Amiri', serif;
    }
    .gradient-header {
      background: linear-gradient(135deg, #083e27 0%, #0d5c3a 50%, #15803d 100%);
    }
  </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

  <!-- Header Section -->
  <header class="gradient-header text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex items-center space-x-3 group">
        <div class="bg-white/10 p-2 rounded-lg backdrop-blur-sm group-hover:bg-white/20 transition">
          <i class="fa-solid fa-kaaba text-2xl text-amber-300"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">ইসলামিক প্রশ্নোত্তর</h1>
          <p class="text-xs text-emerald-200 hidden sm:block">সহিহ জ্ঞানের আলো ছড়িয়ে দিন</p>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="hover:text-amber-300 transition">হোম</button>
        <button onclick="openModal('about')" class="hover:text-amber-300 transition">আমাদের সম্পর্কে</button>
        <button onclick="openModal('privacy')" class="hover:text-amber-300 transition">প্রাইভেসি পলিসি</button>
        <button onclick="openModal('contact')" class="hover:text-amber-300 transition">যোগাযোগ</button>
      </nav>

      <!-- Mobile Menu Button -->
      <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg hover:bg-white/10 text-xl focus:outline-none">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- Mobile Dropdown -->
    <div id="mobileMenu" class="hidden md:hidden bg-emerald-950 border-t border-emerald-800 px-4 py-3 space-y-3 text-sm">
      <button onclick="window.scrollTo({top: 0, behavior: 'smooth'}); toggleMobileMenu();" class="block w-full text-left hover:text-amber-300">হোম</button>
      <button onclick="openModal('about'); toggleMobileMenu();" class="block w-full text-left hover:text-amber-300">আমাদের সম্পর্কে</button>
      <button onclick="openModal('privacy'); toggleMobileMenu();" class="block w-full text-left hover:text-amber-300">প্রাইভেসি পলিসি</button>
      <button onclick="openModal('contact'); toggleMobileMenu();" class="block w-full text-left hover:text-amber-300">যোগাযোগ</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto w-full p-4 sm:p-6 flex-grow space-y-6">

    <!-- Top Banner Ad Placeholder -->
    <div class="bg-amber-50/60 border border-amber-200 rounded-xl p-3 text-center text-xs text-amber-800 flex items-center justify-center space-x-2">
      <i class="fa-solid fa-rectangle-ad text-base text-amber-600"></i>
      <span>বিজ্ঞাপন স্থান (Top Banner Ad)</span>
    </div>

    <!-- Question Submission Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-emerald-100 p-5 sm:p-6">
      <div class="flex items-center space-x-2 mb-4">
        <i class="fa-solid fa-pen-to-square text-emerald-700 text-lg"></i>
        <h2 class="text-lg font-bold text-gray-800">আপনার প্রশ্ন জমা দিন</h2>
      </div>
      <form id="qaForm" onsubmit="submitQuestion(event)" class="space-y-4">
        <textarea id="userQuestion" rows="3" required placeholder="আপনার প্রশ্নটি বিস্তারিত লিখুন... (যেমন: সালাত আদায়ের সঠিক নিয়ম কী?)" class="w-full p-3.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:border-transparent outline-none transition text-sm"></textarea>
        <button type="submit" id="submitBtn" class="bg-emerald-700 hover:bg-emerald-800 text-white font-medium px-6 py-2.5 rounded-xl transition shadow-md hover:shadow border border-emerald-800 flex items-center justify-center text-sm">
          <i class="fa-solid fa-paper-plane mr-2"></i> সাবমিট করুন
        </button>
      </form>
    </div>

    <!-- Search Box -->
    <div class="relative">
      <input type="text" id="searchInput" oninput="filterQuestions()" placeholder="প্রশ্ন বা কিওয়ার্ড দিয়ে খুঁজুন..." class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:ring-2 focus:ring-emerald-600 focus:border-transparent outline-none text-sm">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
    </div>

    <!-- QA List Section -->
    <div id="qaList" class="space-y-4">
      <div id="loading" class="bg-white rounded-2xl p-8 text-center text-gray-500 shadow-sm border border-gray-100">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-700 mb-2"></i>
        <p class="text-sm font-medium">প্রশ্নোত্তর লোড হচ্ছে...</p>
      </div>
    </div>

  </main>

  <!-- Modal Component -->
  <div id="infoModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 relative shadow-2xl max-h-[85vh] overflow-y-auto border border-emerald-100">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modalContent" class="pt-2"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-emerald-950 text-white text-center py-5 border-t border-emerald-900 mt-10 text-xs text-emerald-300">
    <p>© 2026 ইসলামিক প্রশ্নোত্তর। সর্বস্বত্ব সংরক্ষিত।</p>
  </footer>

  <!-- JS Scripts -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwqV5o95GzZp-w9iA5iAalw0-9G0a9-vJq1f-Xg/exec";
    let allQuestions = [];

    window.onload = function() {
      fetchQuestions();
    };

    function toggleMobileMenu() {
      document.getElementById('mobileMenu').classList.toggle('hidden');
    }

    async function fetchQuestions() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        allQuestions = data;
        renderQuestions(data);
      } catch (err) {
        document.getElementById('qaList').innerHTML = `
          <div class="bg-red-50 text-red-600 rounded-2xl p-6 text-center text-sm border border-red-100">
            ডেটা লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে পেজটি রিফ্রেশ করুন।
          </div>`;
      }
    }

    function renderQuestions(data) {
      const listContainer = document.getElementById('qaList');
      if (!data || data.length === 0) {
        listContainer.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-gray-500 shadow-sm border border-gray-100 text-sm">
            কোনো প্রশ্ন পাওয়া যায়নি।
          </div>`;
        return;
      }

      listContainer.innerHTML = data.map((item, index) => {
        const isAnswered = item.answer && item.answer.trim() !== "";
        return `
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 hover:border-emerald-200 transition">
            <div class="flex justify-between items-center mb-3">
              <span class="text-xs font-semibold text-gray-400 bg-gray-100 px-2.5 py-1 rounded-md">প্রশ্ন #${index + 1}</span>
              ${isAnswered 
                ? `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-3 py-1 rounded-full font-medium flex items-center"><i class="fa-solid fa-circle-check mr-1.5 text-emerald-600"></i> উত্তর দেওয়া হয়েছে</span>`
                : `<span class="bg-amber-50 text-amber-700 border border-amber-200 text-xs px-3 py-1 rounded-full font-medium flex items-center"><i class="fa-solid fa-clock mr-1.5 text-amber-600"></i> পেন্ডিং</span>`
              }
            </div>
            <h3 class="text-base font-bold text-gray-900 mb-2 leading-snug">প্রশ্ন: ${escapeHtml(item.question)}</h3>
            ${isAnswered ? `
              <div class="mt-3 p-4 bg-emerald-50/70 border-l-4 border-emerald-600 rounded-r-xl">
                <p class="text-sm text-gray-700 whitespace-pre-line leading-relaxed"><strong class="text-emerald-900">উত্তর:</strong> ${escapeHtml(item.answer)}</p>
              </div>
            ` : ''}
          </div>
        `;
      }).reverse().join('');
    }

    async function submitQuestion(e) {
      e.preventDefault();
      const questionInput = document.getElementById('userQuestion');
      const submitBtn = document.getElementById('submitBtn');
      const questionText = questionInput.value.trim();

      if (!questionText) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> জমাদান হচ্ছে...`;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: questionText })
        });

        questionInput.value = '';
        alert('আপনার প্রশ্নটি সফলভাবে জমা হয়েছে! ইনশাআল্লাহ দ্রুত উত্তর দেওয়া হবে।');
        fetchQuestions();
      } catch (err) {
        alert('প্রশ্ন জমা দিতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i> সাবমিট করুন`;
      }
    }

    function filterQuestions() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allQuestions.filter(item => 
        item.question.toLowerCase().includes(query) || 
        (item.answer && item.answer.toLowerCase().includes(query))
      );
      renderQuestions(filtered);
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function openModal(type) {
      const modal = document.getElementById('infoModal');
      const content = document.getElementById('modalContent');

      if (type === 'about') {
        content.innerHTML = `
          <div class="flex items-center space-x-2 text-emerald-800 mb-3">
            <i class="fa-solid fa-circle-info text-xl"></i>
            <h2 class="text-lg font-bold">আমাদের সম্পর্কে</h2>
          </div>
          <p class="text-gray-600 text-sm leading-relaxed mb-3">
            'ইসলামিক প্রশ্নোত্তর' একটি নির্ভরযোগ্য প্ল্যাটফর্ম, যেখানে ব্যবহারকারীরা তাদের দৈনন্দিন ইসলামিক জীবনের বিভিন্ন প্রশ্ন সরাসরি জমা দিতে পারেন।
          </p>
          <p class="text-gray-600 text-sm leading-relaxed">
            আমাদের লক্ষ্য হলো সহিহ কুরআন ও হাদিসের আলোকে মানুষের প্রশ্নগুলোর সঠিক সমাধান ও দিকনির্দেশনা প্রদান করা।
          </p>
        `;
      } else if (type === 'privacy') {
        content.innerHTML = `
          <div class="flex items-center space-x-2 text-emerald-800 mb-3">
            <i class="fa-solid fa-shield-halved text-xl"></i>
            <h2 class="text-lg font-bold">প্রাইভেসি পলিসি</h2>
          </div>
          <p class="text-gray-600 text-sm leading-relaxed mb-3">
            আপনার প্রাইভেসি আমাদের কাছে অত্যন্ত গুরুত্বপূর্ণ। আমরা ব্যবহারকারীদের কোনো ব্যক্তিগত পরিচয় বা গোপনীয় তথ্য সংগ্রহ করি না।
          </p>
          <p class="text-gray-600 text-sm leading-relaxed">
            আপনি সাইটে যে প্রশ্ন জমা দেন, তা শুধু উত্তর প্রদানের উদ্দেশ্যে আমাদের নিরাপদ ডেটাবেজে জমা থাকে।
          </p>
        `;
      } else if (type === 'contact') {
        content.innerHTML = `
          <div class="flex items-center space-x-2 text-emerald-800 mb-3">
            <i class="fa-solid fa-envelope text-xl"></i>
            <h2 class="text-lg font-bold">যোগাযোগ</h2>
          </div>
          <p class="text-gray-600 text-sm leading-relaxed mb-3">
            যেকোনো পরামর্শ, সংশোধন বা অনুসন্ধানের জন্য সরাসরি আমাদের ইমেইল করুন:
          </p>
          <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-emerald-900 font-semibold text-sm mb-2 text-center">
            rukshanayousuf99@gmail.com
          </div>
          <p class="text-gray-500 text-xs text-center">
            আমরা দ্রুততম সময়ের মধ্যে আপনার ইমেইলের উত্তর দেওয়ার চেষ্টা করব, ইনশাআল্লাহ।
          </p>
        `;
      }
      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('infoModal').classList.add('hidden');
    }
  </script>
</body>
</html>
